project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "lectures/*.qmd"
    - "notebooks/**/*.ipynb"
  resources:
    - "slides/*.pdf"

# navbar "Lectures" menu and sidebar contents: generated by prep_site.py
metadata-files:
  - _lectures.yml

execute:
  enabled: false        # notebooks are shown with their stored outputs
  freeze: auto

website:
  title: "Deep Learning in Classical and Quantum Physics"
  description: "Course at the Jagiellonian University in Kraków: lecture slides and notebooks."
  site-url: "https://marcinplodzien.github.io/deep-learning-for-classical-and-quantum-physics/"
  repo-url: "https://github.com/MarcinPlodzien/deep-learning-for-classical-and-quantum-physics"
  repo-actions: [source]
  page-navigation: true
  navbar:
    logo: assets/course_logo.svg
    logo-alt: "Deep Learning in Classical and Quantum Physics"
    background: primary
    search: true
    pinned: true
    right:
      - icon: github
        href: "https://github.com/MarcinPlodzien/deep-learning-for-classical-and-quantum-physics"
        aria-label: GitHub
      - icon: house
        href: "https://chaos.if.uj.edu.pl/marcinplodzien/"
        aria-label: Homepage
  sidebar:
    logo: assets/course_logo.svg
    style: floating
    search: true
    collapse-level: 1
  page-footer:
    border: true
    left: "© 2026 Marcin Płodzień"
    right: >-
      [Homepage](https://chaos.if.uj.edu.pl/marcinplodzien/) ·
      [Email](mailto:marcin.plodzien@uj.edu.pl) ·
      [ORCID](https://orcid.org/0000-0002-0835-1644) ·
      [Scholar](https://scholar.google.com/citations?user=eC9nCmgAAAAJ&hl=en) ·
      [GitHub](https://github.com/MarcinPlodzien)

format:
  html:
    theme:
      light: [cosmo, assets/qusml.scss]
      dark: [darkly, assets/qusml-dark.scss]
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    html-math-method: mathjax
    grid:
      sidebar-width: 340px
